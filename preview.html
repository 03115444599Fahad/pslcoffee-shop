    function ProductCard({ product, onOpenDetails, onAddToCart }) {
      const handleQuickAdd = () => {
        if (!product.available) return;
        const defaultSize = product.sizes?.[0] || { label: 'Standard', price: product.price };
        onAddToCart(product, 1, defaultSize);
      };

      return (
        <div className="product-card">
          <div className="product-card-img-wrapper" style={{ cursor: 'pointer' }} onClick={() => onOpenDetails(product)}>
            <img src={product.image} alt={product.name} className="product-card-img" loading="lazy" />
            <div className="position-absolute top-0 start-0 p-2 d-flex gap-1 flex-wrap">
              <span className="badge bg-dark bg-opacity-75 text-light">{product.category}</span>
              {product.badge && (
                <span className="badge" style={{ backgroundColor: product.available ? '#C58B52' : '#dc3545', color: '#fff' }}>
                  {product.badge}
                </span>
              )}
            </div>
            <div className="position-absolute bottom-0 end-0 p-2">
              {product.available ? (
                <span className="badge bg-success">Available</span>
              ) : (
                <span className="badge bg-danger">Sold Out</span>
              )}
            </div>
          </div>

          <div className="p-3 d-flex flex-column flex-grow-1">
            <h5 className="mb-1 fw-bold fs-6" style={{ cursor: 'pointer' }} onClick={() => onOpenDetails(product)}>
              {product.name}
            </h5>
            <p className="text-muted small mb-3 flex-grow-1">{product.description}</p>

            <div className="d-flex justify-content-between align-items-center pt-2 border-top">
              <div>
                <span className="text-muted small d-block" style={{ fontSize: '0.72rem' }}>Starting at</span>
                <span className="product-price-tag">{shopConfig.currency} {product.price.toLocaleString()}</span>
              </div>
              <div className="d-flex gap-2">
                <button type="button" className="btn btn-sm btn-outline-secondary rounded-3 px-2" onClick={() => onOpenDetails(product)}>
                  Details
                </button>
                <button
                  type="button"
                  className="btn btn-sm btn-psl-primary px-3"
                  disabled={!product.available}
                  onClick={handleQuickAdd}
                >
                  {product.available ? (<><i className="bi bi-cart-plus me-1"></i>Add</>) : 'Unavailable'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState('home');
      const [navExpanded, setNavExpanded] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [onlyAvailable, setOnlyAvailable] = useState(false);
      const [activeProduct, setActiveProduct] = useState(products[2]);
      const [detailSize, setDetailSize] = useState(products[2].sizes[0]);
      const [detailQty, setDetailQty] = useState(1);

      const [cartItems, setCartItems] = useState(() => {
        try {
          const saved = localStorage.getItem(CART_STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [toastMessage, setToastMessage] = useState(null);

      // Checkout State
      const [customerName, setCustomerName] = useState('');
      const [mobileNumber, setMobileNumber] = useState('');
      const [orderType, setOrderType] = useState('Pickup');
      const [deliveryAddress, setDeliveryAddress] = useState('');
      const [orderNotes, setOrderNotes] = useState('');
      const [errors, setErrors] = useState({});
      const [orderSent, setOrderSent] = useState(false);

      // Contact State
      const [contactName, setContactName] = useState('');
      const [contactMsg, setContactMsg] = useState('');

      // QA Test Panel State
      const [showTestDrawer, setShowTestDrawer] = useState(false);
      const [testResults, setTestResults] = useState([]);

      useEffect(() => {
        try {
          localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cartItems));
        } catch {}
      }, [cartItems]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage((prev) => (prev === msg ? null : prev));
        }, 3000);
      };

      const addToCart = (product, quantity = 1, selectedSize = null) => {
        if (!product.available) return false;
        const sizeLabel = selectedSize ? selectedSize.label : (product.sizes?.[0]?.label || 'Standard');
        const unitPrice = selectedSize ? selectedSize.price : product.price;
        const cartKey = `${product.id}__${sizeLabel}`;

        setCartItems((prev) => {
          const idx = prev.findIndex((item) => item.cartKey === cartKey);
          if (idx > -1) {
            const updated = [...prev];
            updated[idx] = { ...updated[idx], quantity: updated[idx].quantity + quantity };
            return updated;
          }
          return [
            ...prev,
            {
              cartKey,
              id: product.id,
              name: product.name,
              category: product.category,
              image: product.image,
              size: sizeLabel,
              price: unitPrice,
              quantity
            }
          ];
        });
        showToast(`Added ${quantity}x ${product.name} (${sizeLabel}) to cart`);
        return true;
      };

      const updateQuantity = (cartKey, newQty) => {
        if (newQty <= 0) {
          setCartItems((prev) => prev.filter((item) => item.cartKey !== cartKey));
          return;
        }
        setCartItems((prev) =>
          prev.map((item) => (item.cartKey === cartKey ? { ...item, quantity: newQty } : item))
        );
      };

      const removeFromCart = (cartKey) => {
        setCartItems((prev) => prev.filter((item) => item.cartKey !== cartKey));
      };

      const clearCart = () => setCartItems([]);

      const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);

      const categoryCounts = useMemo(() => {
        const counts = { All: products.length };
        products.forEach((p) => {
          counts[p.category] = (counts[p.category] || 0) + 1;
        });
        return counts;
      }, []);

      const filteredProducts = useMemo(() => {
        return products.filter((p) => {
          const matchesCat = selectedCategory === 'All' || p.category === selectedCategory;
          const q = searchQuery.trim().toLowerCase();
          const matchesSearch =
            !q ||
            p.name.toLowerCase().includes(q) ||
            p.description.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q);
          const matchesAvail = !onlyAvailable || p.available;
          return matchesCat && matchesSearch && matchesAvail;
        });
      }, [selectedCategory, searchQuery, onlyAvailable]);

      const navigateTo = (targetPage) => {
        setPage(targetPage);
        setNavExpanded(false);
        window.scrollTo(0, 0);
      };

      const openCategoryMenu = (catId) => {
        setSelectedCategory(catId);
        navigateTo('menu');
      };

      const openProductDetails = (product) => {
        setActiveProduct(product);
        setDetailSize(product.sizes?.[0] || { label: 'Standard', price: product.price });
        setDetailQty(1);
        navigateTo('details');
      };

      const handleAddCombo = (combo) => {
        const comboProduct = {
          id: combo.id,
          name: combo.title,
          category: 'Special Combo',
          description: combo.subtitle,
          price: combo.comboPrice,
          image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80',
          available: true
        };
        addToCart(comboProduct, 1, { label: combo.subtitle, price: combo.comboPrice });
      };

      const deliveryCharge =
        orderType === 'Delivery'
          ? subtotal >= shopConfig.freeDeliveryThreshold
            ? 0
            : shopConfig.deliveryFee
          : 0;
      const grandTotal = subtotal + deliveryCharge;

      const validateCheckout = (nameVal = customerName, phoneVal = mobileNumber, typeVal = orderType, addrVal = deliveryAddress) => {
        const newErrs = {};
        if (!nameVal.trim() || nameVal.trim().length < 2) {
          newErrs.customerName = 'Please enter your full name.';
        }

                  )}
                </div>
              </div>
            )}

            {/* ==================== 4.3 PRODUCT DETAILS ==================== */}
            {page === 'details' && activeProduct && (
              <div className="py-5">
                <div className="container">
                  <button
                    type="button"
                    className="btn btn-sm btn-psl-outline mb-4"
                    onClick={() => openCategoryMenu(activeProduct.category)}
                  >
                    <i className="bi bi-arrow-left me-1"></i> Back to {activeProduct.category}
                  </button>

                  <div className="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                    <div className="row g-0">
                      <div className="col-lg-6 bg-psl-cream">
                        <img
                          src={activeProduct.image}
                          alt={activeProduct.name}
                          className="w-100 h-100"
                          style={{ objectFit: 'cover', minHeight: '340px', maxHeight: '500px' }}
                        />
                      </div>
                      <div className="col-lg-6">
                        <div className="card-body p-4 p-lg-5 d-flex flex-column h-100">
                          <div className="d-flex align-items-center gap-2 mb-2">
                            <span className="badge bg-dark">{activeProduct.category}</span>
                            {activeProduct.available ? (
                              <span className="badge bg-success">Available</span>
                            ) : (
                              <span className="badge bg-danger">Sold Out</span>
                            )}
                          </div>
                          <h1 className="fw-bold h2 mb-2">{activeProduct.name}</h1>
                          <div className="fs-3 fw-bold mb-3" style={{ color: '#5B3424' }}>
                            {shopConfig.currency} {((detailSize?.price || activeProduct.price) * detailQty).toLocaleString()}
                          </div>
                          <p className="text-muted mb-4">
                            {activeProduct.longDescription || activeProduct.description}
                          </p>

                          {activeProduct.sizes && (
                            <div className="mb-4">
                              <label className="form-label fw-bold small text-uppercase text-muted">
                                Select Size / Serving Option
                              </label>
                              <div className="d-flex flex-wrap gap-2">
                                {activeProduct.sizes.map((s) => (
                                  <button
                                    key={s.label}
                                    type="button"
                                    className={`btn btn-sm rounded-3 px-3 py-2 ${
                                      detailSize?.label === s.label ? 'btn-psl-primary' : 'btn-outline-secondary'
                                    }`}
                                    onClick={() => setDetailSize(s)}
                                  >
                                    <div>{s.label}</div>
                                    <div className="small opacity-85">{shopConfig.currency} {s.price}</div>
                                  </button>
                                ))}
                              </div>
                            </div>
                          )}

                          <div className="row g-3 align-items-end mt-auto pt-3 border-top">
                            <div className="col-sm-4">
                              <label className="form-label fw-bold small text-uppercase text-muted">Quantity</label>
                              <div className="input-group">
                                <button
                                  type="button"
                                  className="btn btn-outline-secondary"
                                  disabled={!activeProduct.available || detailQty <= 1}
                                  onClick={() => setDetailQty((q) => Math.max(1, q - 1))}
                                >
                                  <i className="bi bi-dash"></i>
                                </button>
                                <span className="form-control text-center fw-bold">{detailQty}</span>
                                <button
                                  type="button"
                                  className="btn btn-outline-secondary"
                                  disabled={!activeProduct.available}
                                  onClick={() => setDetailQty((q) => q + 1)}
                                >
                                  <i className="bi bi-plus"></i>
                                </button>
                              </div>
                            </div>
                            <div className="col-sm-8 d-flex gap-2">
                              <button
                                type="button"
                                className="btn btn-psl-primary flex-grow-1"
                                disabled={!activeProduct.available}
                                onClick={() => addToCart(activeProduct, detailQty, detailSize)}
                              >
                                <i className="bi bi-cart-plus me-2"></i>
                                {activeProduct.available ? 'Add to Cart' : 'Sold Out'}
                              </button>
                              {activeProduct.available && (
                                <button
                                  type="button"
                                  className="btn btn-psl-accent"
                                  onClick={() => {
                                    addToCart(activeProduct, detailQty, detailSize);
                                    navigateTo('cart');
                                  }}
                                >
                                  Buy Now
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 4.4 SHOPPING CART ==================== */}
            {page === 'cart' && (
              <div className="py-5">
                <div className="container">
                  {cartItems.length === 0 ? (
                    <div className="bg-white rounded-4 shadow-sm p-5 text-center mx-auto" style={{ maxWidth: '550px' }}>
                      <i className="bi bi-cart-x display-4" style={{ color: '#5B3424' }}></i>
                      <h2 className="fw-bold mt-3">Your Shopping Cart is Empty</h2>
                      <p className="text-muted mb-4">
                        Explore our Coffee, Tea, and Chips & Snacks menu to add items to your order.
                      </p>
                      <button type="button" className="btn btn-psl-primary btn-lg px-4" onClick={() => openCategoryMenu('All')}>
                        Browse Menu
                      </button>
                    </div>
                  ) : (
                    <>
                      <div className="d-flex flex-wrap justify-content-between align-items-center mb-4">
                        <div>
                          <span className="text-uppercase fw-bold small" style={{ color: '#C58B52' }}>Review Your Selection</span>
                          <h1 className="fw-bold mb-0">Shopping Cart ({totalItems} items)</h1>
                        </div>
                        <button type="button" className="btn btn-sm btn-outline-danger" onClick={clearCart}>
                          <i className="bi bi-trash3 me-1"></i>Clear Cart
                        </button>
                      </div>

                      <div className="row g-4">
                        <div className="col-lg-8">
                          {cartItems.map((item) => (
                            <div className="card border-0 shadow-sm rounded-4 mb-3" key={item.cartKey}>
                              <div className="card-body p-3">
                                <div className="row align-items-center g-3">
                                  <div className="col-3 col-sm-2">
                                    <img
                                      src={item.image}
                                      alt={item.name}
                                      className="img-fluid rounded-3"
                                      style={{ height: '75px', width: '100%', objectFit: 'cover' }}
                                    />
                                  </div>
                                  <div className="col-9 col-sm-4">
                                    <span className="badge bg-secondary bg-opacity-10 text-dark mb-1">{item.category}</span>
                                    <h6 className="mb-1 fw-bold">{item.name}</h6>
                                    <div className="small text-muted">Option: <strong>{item.size}</strong></div>
                                    <div className="small text-muted">Unit: {shopConfig.currency} {item.price}</div>
                                  </div>
                                  <div className="col-6 col-sm-3">
                                    <div className="input-group input-group-sm" style={{ maxWidth: '130px' }}>
                                      <button
                                        type="button"
                                        className="btn btn-outline-secondary"
                                        onClick={() => updateQuantity(item.cartKey, item.quantity - 1)}
                                      >
                                        <i className="bi bi-dash"></i>
                                      </button>
                                      <span className="form-control text-center fw-bold bg-white">{item.quantity}</span>
                                      <button
                                        type="button"
                                        className="btn btn-outline-secondary"
                                        onClick={() => updateQuantity(item.cartKey, item.quantity + 1)}
                                      >
                                        <i className="bi bi-plus"></i>
                                      </button>
                                    </div>
                                  </div>
                                  <div className="col-6 col-sm-3 text-end">
                                    <div className="fw-bold fs-6 mb-1" style={{ color: '#5B3424' }}>
                                      {shopConfig.currency} {(item.price * item.quantity).toLocaleString()}
                                    </div>
                                    <button
                                      type="button"
                                      className="btn btn-sm btn-link text-danger text-decoration-none p-0"
                                      onClick={() => removeFromCart(item.cartKey)}
                                    >
                                      <i className="bi bi-trash3 me-1"></i>Remove
                                    </button>
                                  </div>
                                </div>
                              </div>
                            </div>
                          ))}

                          <div className="d-flex justify-content-between align-items-center mt-3">
                            <button type="button" className="btn btn-psl-outline" onClick={() => openCategoryMenu('All')}>
                              <i className="bi bi-arrow-left me-2"></i>Continue Shopping
                            </button>
                            <span className="small text-muted">
                              <i className="bi bi-shield-check text-success me-1"></i>Saved in browser localStorage
                            </span>
                          </div>
                        </div>

                        <div className="col-lg-4">
                          <div className="card border-0 shadow-sm rounded-4 p-4">
                            <h4 className="fw-bold mb-3">Order Summary</h4>
                            <div className="d-flex justify-content-between mb-2">
                              <span className="text-muted">Items ({totalItems})</span>
                              <span className="fw-semibold">{shopConfig.currency} {subtotal.toLocaleString()}</span>
                            </div>
                            <div className="p-3 rounded-3 bg-psl-cream small my-3">
                              <i className="bi bi-truck me-1" style={{ color: '#5B3424' }}></i>
                              {subtotal >= shopConfig.freeDeliveryThreshold ? (
                                <span className="fw-semibold text-success">Your order qualifies for FREE home delivery!</span>
                              ) : (
                                <span>
                                  Add <strong>{shopConfig.currency} {(shopConfig.freeDeliveryThreshold - subtotal).toLocaleString()}</strong> more for Free Delivery (or choose Free Pickup).
                                </span>
                              )}
                            </div>
                            <hr />
                            <div className="d-flex justify-content-between align-items-center mb-4">
                              <span className="fw-bold fs-5">Subtotal</span>
                              <span className="fw-bold fs-4" style={{ color: '#5B3424' }}>
                                {shopConfig.currency} {subtotal.toLocaleString()}
                              </span>
                            </div>
                            <button type="button" className="btn btn-psl-primary w-100 py-3" onClick={() => navigateTo('checkout')}>
                              Proceed to Order <i className="bi bi-arrow-right ms-2"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                    </>
                  )}
                </div>
              </div>
            )}

            {/* ==================== 4.5 CHECKOUT / PLACE ORDER ==================== */}
            {page === 'checkout' && (
              <div className="py-5">
                <div className="container">
                  <button type="button" className="btn btn-sm btn-psl-outline mb-3" onClick={() => navigateTo('cart')}>
                    <i className="bi bi-arrow-left me-1"></i> Back to Shopping Cart
                  </button>
                  <h1 className="fw-bold">Checkout & Place Order</h1>
                  <p className="text-muted mb-4">
                    Enter your contact details below to generate a pre-filled WhatsApp order message.
                  </p>

                  {orderSent && (
                    <div className="alert alert-success rounded-4 shadow-sm p-4 mb-4">
                      <h5 className="fw-bold mb-1"><i className="bi bi-whatsapp me-2"></i>WhatsApp Order Window Opened!</h5>
                      <p className="mb-2 small">
                        Please press <strong>Send</strong> in WhatsApp so our shop receives your order and confirms availability.
                      </p>
                      <button
                        type="button"
                        className="btn btn-sm btn-success"
                        onClick={() => { clearCart(); setOrderSent(false); navigateTo('home'); }}
                      >
                        Clear Cart & Return Home
                      </button>
                    </div>
                  )}

                  <div className="row g-4">
                    <div className="col-lg-7">
                      <form onSubmit={handleSendWhatsApp} noValidate className="card border-0 shadow-sm rounded-4 p-4">
                        <h4 className="fw-bold mb-3">1. Customer & Delivery Details</h4>

                        <div className="mb-3">
                          <label className="form-label fw-semibold">Full Name <span className="text-danger">*</span></label>
                          <input
                            type="text"
                            className={`form-control ${errors.customerName ? 'is-invalid' : ''}`}
                            placeholder="e.g. Ahmed Khan"
                            value={customerName}
                            onChange={(e) => setCustomerName(e.target.value)}
                          />
                          {errors.customerName && <div className="invalid-feedback">{errors.customerName}</div>}
                        </div>

                        <div className="mb-3">
                          <label className="form-label fw-semibold">Mobile / WhatsApp Number <span className="text-danger">*</span></label>
                          <input
                            type="tel"
                            className={`form-control ${errors.mobileNumber ? 'is-invalid' : ''}`}
                            placeholder="e.g. 0300 1234567"
                            value={mobileNumber}
                            onChange={(e) => setMobileNumber(e.target.value)}
                          />
                          {errors.mobileNumber && <div className="invalid-feedback">{errors.mobileNumber}</div>}
                        </div>

                        <div className="mb-3">
                          <label className="form-label fw-semibold d-block">Order Method <span className="text-danger">*</span></label>
                          <div className="row g-2">
                            <div className="col-6">
                              <button
                                type="button"
                                className={`btn w-100 py-3 rounded-3 ${orderType === 'Pickup' ? 'btn-psl-primary' : 'btn-outline-secondary'}`}
                                onClick={() => setOrderType('Pickup')}
                              >
                                <i className="bi bi-shop d-block fs-4"></i>
                                <strong>Shop Pickup</strong> (Free)
                              </button>
                            </div>
                            <div className="col-6">
                              <button
                                type="button"
                                className={`btn w-100 py-3 rounded-3 ${orderType === 'Delivery' ? 'btn-psl-primary' : 'btn-outline-secondary'}`}
                                onClick={() => setOrderType('Delivery')}
                              >
                                <i className="bi bi-bicycle d-block fs-4"></i>
                                <strong>Home Delivery</strong> ({deliveryCharge === 0 && orderType === 'Delivery' ? 'Free' : `PKR ${shopConfig.deliveryFee}`})
                              </button>
                            </div>
                          </div>
                        </div>

                        {orderType === 'Delivery' && (
                          <div className="mb-3">
                            <label className="form-label fw-semibold">Complete Delivery Address <span className="text-danger">*</span></label>
                            <textarea
                              rows="2"
                              className={`form-control ${errors.deliveryAddress ? 'is-invalid' : ''}`}
                              placeholder="House/Flat #, Street, Block, Sector & nearby landmark"
                              value={deliveryAddress}
                              onChange={(e) => setDeliveryAddress(e.target.value)}
                            />
                            {errors.deliveryAddress && <div className="invalid-feedback">{errors.deliveryAddress}</div>}
                          </div>
                        )}

                        <div className="mb-4">
                          <label className="form-label fw-semibold">Special Instructions / Order Notes (Optional)</label>
                          <textarea
                            rows="2"
                            className="form-control"
                            placeholder="e.g. Less sugar in Doodh Patti, extra garlic dip..."
                            value={orderNotes}
                            onChange={(e) => setOrderNotes(e.target.value)}
                          />
                        </div>

                        <div className="p-3 rounded-3 bg-psl-cream small mb-4">
                          <strong><i className="bi bi-info-circle-fill me-1"></i>External Service Notice:</strong> Clicking below opens WhatsApp with your pre-filled order message. You must press <strong>Send</strong> in WhatsApp, and the shop will confirm your final order.
                        </div>

                        <button type="submit" className="btn btn-whatsapp w-100 fs-5">
                          <i className="bi bi-whatsapp me-2"></i>
                          Send Order on WhatsApp ({shopConfig.currency} {grandTotal.toLocaleString()})
                        </button>
                      </form>
                    </div>

                    <div className="col-lg-5">
                      <div className="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h4 className="fw-bold mb-3">2. Order Summary ({totalItems} items)</h4>
                        {cartItems.map((item) => (
                          <div key={item.cartKey} className="d-flex justify-content-between pb-2 mb-2 border-bottom small">
                            <span>{item.name} ({item.size}) × {item.quantity}</span>
                            <strong>{shopConfig.currency} {(item.price * item.quantity).toLocaleString()}</strong>
                          </div>
                        ))}
                        <div className="d-flex justify-content-between align-items-center pt-2">
                          <span className="fw-bold fs-5">Grand Total</span>
                          <span className="fw-bold fs-4" style={{ color: '#5B3424' }}>
                            {shopConfig.currency} {grandTotal.toLocaleString()}
                          </span>
                        </div>
                      </div>

                      <div className="card border-0 shadow-sm rounded-4 p-4 bg-white">
                        <h6 className="fw-bold mb-2">
                          <i className="bi bi-chat-left-text-fill text-success me-2"></i>
                          WhatsApp Message Preview
                        </h6>
                        <pre
                          className="p-3 rounded-3 mb-0 small"
                          style={{
                            backgroundColor: '#E8F5E9',
                            whiteSpace: 'pre-wrap',
                            fontFamily: 'inherit',
                            fontSize: '0.82rem',
                            borderLeft: '4px solid #25D366'
                          }}
                        >
                          {buildWhatsAppMessage()}
                        </pre>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 4.6 ABOUT US ==================== */}
            {page === 'about' && (
              <div className="py-5">
                <div className="container">
                  <div className="row g-5 align-items-center mb-5">
                    <div className="col-lg-6">
                      <span className="text-uppercase fw-bold small" style={{ color: '#C58B52' }}>About {shopConfig.name}</span>
                      <h1 className="fw-bold mt-1 mb-3">
                        Bringing People Together Over Great Coffee, Karak Chai & Snacks
                      </h1>
                      <p className="text-muted">
                        Founded with a love for both specialty café culture and Pakistan's timeless chai traditions, <strong>{shopConfig.name}</strong> is your neighborhood spot for energizing mornings, relaxed work sessions, and lively evening hangouts.
                      </p>
                      <p className="text-muted">
                        Whether you crave a double shot of 100% Arabica espresso, a clay matka of rich slow-brewed Doodh Patti, or crispy hand-cut kettle chips and club sandwiches, our menu is crafted fresh to order.
                      </p>
                      <button type="button" className="btn btn-psl-primary mt-2" onClick={() => openCategoryMenu('All')}>
                        Explore Our Menu
                      </button>
                    </div>
                    <div className="col-lg-6">
                      <img
                        src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80"
                        alt="PSL Coffee Shop Barista"
                        className="img-fluid rounded-4 shadow"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 4.7 CONTACT US ==================== */}
            {page === 'contact' && (
              <div className="py-5">
                <div className="container">
                  <div className="text-center mb-5">
                    <span className="text-uppercase fw-bold small" style={{ color: '#C58B52' }}>Get In Touch</span>
                    <h1 className="fw-bold mt-1">Contact & Visit Us</h1>
                  </div>
                  <div className="row g-4">
                    <div className="col-lg-6">
                      <div className="card border-0 shadow-sm rounded-4 p-4 h-100">
                        <h4 className="fw-bold mb-3">Shop Contact Details</h4>
                        <p><strong><i className="bi bi-geo-alt-fill text-danger me-2"></i>Address:</strong> {shopConfig.address}</p>
                        <p><strong><i className="bi bi-telephone-fill text-success me-2"></i>Phone / WhatsApp:</strong> {shopConfig.phoneDisplay}</p>
                        <p><strong><i className="bi bi-envelope-fill text-warning me-2"></i>Email:</strong> {shopConfig.email}</p>
                        <div className="d-flex gap-2 mt-2">
                          <a href={shopConfig.mapUrl} target="_blank" rel="noopener noreferrer" className="btn btn-psl-outline btn-sm">
                            <i className="bi bi-map me-1"></i> Open Map Link
                          </a>
                          <a href={`https://wa.me/${shopConfig.whatsappNumber}`} target="_blank" rel="noopener noreferrer" className="btn btn-success btn-sm">
                            <i className="bi bi-whatsapp me-1"></i> Direct WhatsApp
                          </a>
                        </div>
                      </div>
                    </div>
                    <div className="col-lg-6">
                      <div className="card border-0 shadow-sm rounded-4 p-4 h-100 bg-psl-cream">
                        <h4 className="fw-bold mb-3">Send a Quick WhatsApp Inquiry</h4>
                        <form
                          onSubmit={(e) => {
                            e.preventDefault();
                            const text = `Assalam-o-Alaikum ${shopConfig.name}!\nName: ${contactName}\nMessage: ${contactMsg}`;
                            window.open(`https://wa.me/${shopConfig.whatsappNumber}?text=${encodeURIComponent(text)}`, '_blank');
                          }}
                        >
                          <div className="mb-3">
                            <label className="form-label fw-semibold">Your Name</label>
                            <input className="form-control bg-white" required value={contactName} onChange={(e) => setContactName(e.target.value)} />
                          </div>
                          <div className="mb-3">
                            <label className="form-label fw-semibold">Message</label>
                            <textarea className="form-control bg-white" rows="3" required value={contactMsg} onChange={(e) => setContactMsg(e.target.value)} />
                          </div>
                          <button type="submit" className="btn btn-whatsapp w-100">
                            <i className="bi bi-whatsapp me-2"></i> Send via WhatsApp
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Toast */}
          {toastMessage && (
            <div className="psl-toast-container" role="status">
              <div className="psl-toast d-flex align-items-center justify-content-between gap-3">
                <div className="small">
                  <i className="bi bi-check-circle-fill text-warning me-2"></i>
                  {toastMessage}
                </div>
                <button
                  type="button"
                  className="btn btn-sm btn-psl-accent py-1 px-2"
                  onClick={() => { setToastMessage(null); navigateTo('cart'); }}
                >
                  View Cart
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="footer-psl pt-5 pb-4 mt-auto">
            <div className="container">
              <div className="row g-4 pb-4 border-bottom border-secondary border-opacity-25">
                <div className="col-md-4">
                  <h5 className="text-white fw-bold">{shopConfig.name}</h5>
                  <p className="small opacity-75">{shopConfig.tagline}</p>
                </div>
                <div className="col-md-4">
                  <h6 className="text-uppercase fw-bold" style={{ color: '#C58B52' }}>Opening Hours</h6>
                  {shopConfig.openingHours.map((s, i) => (
                    <div key={i} className="small opacity-85">{s.days}: {s.hours}</div>
                  ))}
                </div>
                <div className="col-md-4">
                  <h6 className="text-uppercase fw-bold" style={{ color: '#C58B52' }}>Contact</h6>
                  <div className="small opacity-85">{shopConfig.address}</div>
                  <div className="small opacity-85">WhatsApp: {shopConfig.phoneDisplay}</div>
                </div>
              </div>
              <div className="text-center pt-3 small opacity-75">
                &copy; {new Date().getFullYear()} {shopConfig.name} • Free Hosting Ready on Cloudflare Pages
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
